{% extends "base.html" %}

{% block content %}
<h1>Member Details</h1>

<div class="panel">
    <div class="panel-title">Member Profile</div>
    <table class="data-table">
        <tr><th>Member ID</th><td>{{ member_id }}</td></tr>
        <tr><th>Name</th><td>{{ member.name }}</td></tr>
        <tr><th>Status</th><td>{{ member.status }}</td></tr>
    </table>
</div>

<div class="panel">
    <div class="panel-title">Current Accounts</div>
    <table class="data-table wide">
        <tr><th>Account</th><th>Balance</th></tr>
        <tr><td>Checking</td><td>{{ member.checking_balance }}</td></tr>
        <tr><td>Savings</td><td>{{ member.savings_balance }}</td></tr>
    </table>
</div>

<p><a class="button-link" href="/members/{{ member_id }}/subaccounts/new">Open New Sub-account</a></p>
{% endblock %}
