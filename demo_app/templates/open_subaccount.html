{% extends "base.html" %}

{% block content %}
<h1>Open Sub-account</h1>

<div class="panel">
    <div class="panel-title">New Sub-account</div>
    <form method="post" action="/members/{{ member_id }}/subaccounts/review">
        <table class="form-table">
            <tr>
                <td>Member</td>
                <td>{{ member.name }} ({{ member_id }})</td>
            </tr>
            <tr>
                <td>Account Type</td>
                <td>
                    <label><input type="radio" name="account_type" value="checking" required> Checking</label><br>
                    <label><input type="radio" name="account_type" value="savings"> Savings</label>
                </td>
            </tr>
            <tr>
                <td><label for="nickname">Nickname</label></td>
                <td><input id="nickname" name="nickname" type="text"></td>
            </tr>
            <tr>
                <td></td>
                <td><button type="submit">Continue</button></td>
            </tr>
        </table>
    </form>
</div>

{% if error %}
<div class="error-box">{{ error }}</div>
{% endif %}
{% endblock %}
