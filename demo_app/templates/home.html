{% extends "base.html" %}

{% block content %}
<h1>Member Search</h1>

<div class="panel">
    <div class="panel-title">Find a Member</div>
    <form method="post" action="/members/search">
        <table class="form-table">
            <tr>
                <td><label for="member_id">Member ID</label></td>
                <td><input id="member_id" name="member_id" type="text" required></td>
            </tr>
            <tr>
                <td></td>
                <td><button type="submit">Search Member</button></td>
            </tr>
        </table>
    </form>
</div>

<div class="help">Use a member ID to view the member profile.</div>
{% endblock %}
